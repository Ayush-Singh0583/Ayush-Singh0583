name: Tic-tac-toe

# Visitors play by clicking a square in the README, which opens an issue
# titled "ttt|move|<1-9>" or "ttt|new". This workflow plays the move,
# lets the bot answer, updates the README, then replies and closes the issue.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  play:
    if: startsWith(github.event.issue.title, 'ttt|')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Play the move and update the README
        env:
          # Issue fields are typed by strangers, so they are only passed as
          # environment variables and never pasted into the script itself.
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
          REPLY_FILE: ${{ runner.temp }}/reply.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Two people can move at the same moment. If our push is rejected,
          # start again from the newest board and replay the move on it.
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin "$BRANCH"
            git reset --hard FETCH_HEAD
            python3 game/tictactoe.py
            git add README.md game/state.json
            if git diff --cached --quiet; then
              echo "The board did not change, so there is nothing to commit."
              exit 0
            fi
            git commit -m "Tic-tac-toe: move by @$ISSUE_USER (#$ISSUE_NUMBER)"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Someone else moved first. Retrying with the new board (attempt $attempt)."
            sleep $((attempt * 2))
          done
          echo "::error::Could not save the move after 5 attempts."
          exit 1

      - name: Reply on the issue and close it
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          REPLY_FILE: ${{ runner.temp }}/reply.md
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file "$REPLY_FILE"
          gh issue close "$ISSUE_NUMBER" --repo "$REPO"
